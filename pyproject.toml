
[build-system]
requires      = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "make-html"
version = "1.0.0"
description = "Classes to generate HTML"
readme = "readme.md"
authors = [{ name = "Ian Jones"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/jonesim/html-classes"

[tool.setuptools]
packages = ['html_classes']